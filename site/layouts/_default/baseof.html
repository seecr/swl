<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}SWL – {{ site.Params.tagline }}{{ else }}{{ .Title }} – SWL{{ end }}</title>
  <meta name="description" content="SWL (Seecr Web Lib): interactive web applications in Python with Starlette, Jinja and htmx. No JavaScript frontend, no build step.">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/syntax.css" | relURL }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80' font-family='monospace'>{}</text></svg>">
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
